name: CI (Python + Node)

on:
    pull_request:
    push:
        branches: [main]
    workflow_dispatch:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    python_ci:
        name: Python CI
        runs-on: ubuntu-24.04
        defaults:
            run:
                working-directory: bot/python_ai
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"
                  cache: "pip"
                  cache-dependency-path: |
                      bot/python_ai/requirements.txt

            - name: Install Dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt

    node_ci:
        name: Node CI
        runs-on: ubuntu-24.04
        defaults:
            run:
                working-directory: bot/node_ws
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"
                  cache-dependency-path: |
                      bot/node_ws/package-lock.json

            - name: Install Dependencies
              run: npm ci

            - name: Lint
              run: npm run lint --if-present

            - name: Test
              run: npm test --if-present

    smoke:
        name: Smoke (repo-level)
        runs-on: ubuntu-24.04
        needs: [python_ci, node_ci]
        steps:
            - name: Summary
              run: echo "✅ Python + Node CI passed"
